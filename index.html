<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダダサバイバー イベント情報</title>
  <meta name="description" content="ダダサバイバー(Survivor.io)の最新イベント情報を確認・管理できる非公式ツール。エスケープオペレーション等の残り日数をわかりやすく表示します。">
  <meta property="og:title" content="ダダサバイバー イベント情報">
  <meta property="og:description" content="ダダサバイバー(Survivor.io)のイベントスケジュールや残り日数を確認できるカレンダーツールです。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://enakyo.github.io/dada-info/">
  <meta property="og:site_name" content="ダダサバイバー イベント情報">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <meta name="google-site-verification" content="-BUnI_vBlb3DD_EOdd6zE0rb4uLGTtt8RwJNwlfQh1Q" />
</head>

<body>
  <div class="app-container">
    <header>
      <h1 id="app-title">ダダサバイバー イベント情報</h1>
      <button id="config-btn" class="icon-button" aria-label="設定">⚙️</button>
    </header>

    <div class="main-content">
      <!-- Calendar Section -->
      <section class="calendar-section">
        <div class="calendar-header">
          <button id="prev-month">&lt;</button>
          <h2 id="current-month-label">2026年 1月</h2>
          <button id="next-month">&gt;</button>
          <button id="today-btn" class="text-button">今日</button>
        </div>
        <div class="calendar-container" id="calendar-container">
          <!-- Month tables will be injected here -->
        </div>
      </section>

      <!-- Selected Date Info -->
      <section class="info-section">
        <h3 id="selected-date-label">2026-01-23 (金)</h3>
        <div id="event-list" class="event-list">
          <!-- Event cards generated by JS -->
          <div class="loading-state">Loading...</div>
        </div>
      </section>

      <!-- Copy Section -->
      <section class="copy-section">
        <div class="copy-header">
          <h3>今日の更新状況コピー用(ギルドの皆さんへの案内にご利用ください)</h3>
          <button id="copy-btn" class="primary-button">コピー</button>
        </div>
        <textarea id="copy-textarea" rows="12" readonly></textarea>
      </section>
    </div>
    
    <footer>
      <p class="last-updated">ツール最終更新日: 2026-08-11</p>
    </footer>
  </div>

  <!-- Config Modal -->
  <div id="config-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 data-term="settings">設定</h2>
        <button id="close-config" class="close-button">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label data-term="language">言語</label>
          <select id="lang-select">
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </div>

        <div class="form-group">
          <p class="note">※ゲーム内日付は UTC+8 基準で計算されます（JST 午前1時に更新）</p>
        </div>

        <div class="form-group">
          <label>イベント定義 (JSON)</label>
          <textarea id="config-json-editor" rows="10"></textarea>
          <p class="note-small">上級者向け: ここでイベント定義を直接編集できます。</p>
        </div>

        <div class="form-actions">
          <button id="save-config-btn" class="primary-button">保存 / Save</button>
          <button id="reset-config-btn" class="danger-button" data-term="reset_settings">初期設定に戻す</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
