name: Daily Data Update

on:
  schedule:
    # 毎日 JST 1:15 (UTC 16:15) に実行 (スケジュール再登録のため時間変更)
    - cron: '15 16 * * *'
  # 手動実行も許可（Actionsタブから実行可能）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    # defaults:
    #   run:
    #     working-directory: ./dada-info  # リポジトリルートにある場合は不要なので削除


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Export Script
        run: node export-events.js

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add daily_events.json
          # 変更がある場合のみコミット
          git diff --staged --quiet || git commit -m "Update daily_events.json [skip ci]"
          git push
